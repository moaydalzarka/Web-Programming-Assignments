<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Tip Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container"> 
    <h2>Tip Calculator</h2>
    <label for="billAmount">Bill Amount:</label>
    <input type="number" id="billAmount" placeholder="Enter bill amount" step="0.01">

    <div id="error-message">Please enter a valid bill amount!</div>

    <button id="calculateBtn">Calculate Tip</button>
    <p id="tipAmount" class="result"></p>
    <p id="totalBill" class="result"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
